server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
  servlet:
    session:
      timeout: 3600s
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: jiosi-inbox-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:jiosi_inbox}${POSTGRES_SSL_PARAMS:}}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:jiosi_user}}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:jiosi_secure_password_example}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:60000}
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true
    url: ${FLYWAY_URL:${DATABASE_DIRECT_URL:${spring.datasource.url}}}
    user: ${FLYWAY_USER:${DATABASE_USERNAME:${spring.datasource.username}}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD:${spring.datasource.password}}}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.jiosi.inbox: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  version: 0.1.0-alpha
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:${SERVER_URL:http://localhost:8080}}
  security:
    enabled: ${SECURITY_ENABLED:true}
    jwt-secret: ${JWT_SECRET:jiosi_default_development_hmac_secret_key_minimum_32_bytes_long}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  google:
    client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,https://inbox.jiosi.online,https://jiosi-inbox-api.onrender.com}
    allowed-extension-ids: ${CORS_ALLOWED_EXTENSION_IDS:}

jiosi:
  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model-summary: ${GROQ_MODEL_SUMMARY:llama-3.3-70b-versatile}
      model-draft: ${GROQ_MODEL_DRAFT:llama-3.1-8b-instant}
      model-classify: ${GROQ_MODEL_CLASSIFY:llama-3.3-70b-versatile}
      timeout-seconds: ${GROQ_TIMEOUT_SECONDS:15}
      max-retries: ${GROQ_MAX_RETRIES:2}
      enabled: ${GROQ_ENABLED:true}

