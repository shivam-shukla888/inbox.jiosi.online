spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

logging:
  level:
    root: WARN
    com.jiosi.inbox: INFO

app:
  security:
    enabled: true
    jwt-secret: jiosi_test_hmac_secret_key_minimum_32_bytes_long
