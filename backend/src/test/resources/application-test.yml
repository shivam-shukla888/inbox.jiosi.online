spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - openid
              - profile
              - email

logging:
  level:
    root: WARN
    com.jiosi.inbox: INFO

app:
  frontend-url: http://localhost:3000
  google:
    client-id: test-google-client-id
  security:
    enabled: true
    jwt-secret: jiosi_test_hmac_secret_key_minimum_32_bytes_long
    jwt-expiration-seconds: 3600

jiosi:
  ai:
    groq:
      api-key: test-groq-api-key
      base-url: http://localhost:8089/openai/v1
      model-summary: llama-3.3-70b-versatile
      model-draft: llama-3.1-8b-instant
      model-classify: llama-3.3-70b-versatile
      timeout-seconds: 5
      max-retries: 1
      enabled: true

