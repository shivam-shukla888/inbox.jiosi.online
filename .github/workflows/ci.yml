name: JIOSI Inbox CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jiosi_inbox
          POSTGRES_USER: jiosi
          POSTGRES_PASSWORD: jiosi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run Backend Tests
        run: |
          cd backend
          ./mvnw clean test

      - name: Package Backend JAR
        run: |
          cd backend
          ./mvnw package -DskipTests

  frontend-ci:
    name: Frontend CI (React 18 / TypeScript / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vitest Suite
        run: |
          cd frontend
          npm test -- --run

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

